name: Validate integration
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Check workflow security policy
        run: python scripts/security_check.py
      - name: Compile Python
        run: python -m compileall -q custom_components/entity_proxy
      - name: Run policy unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify release metadata matches changelog
        run: python scripts/release_metadata.py --check
      - name: Validate JSON manifests and translations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text())
              print('Valid JSON:', path)
          PY

  home-assistant-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Install pinned Home Assistant test dependencies
        run: python -m pip install -r integration_tests/requirements.txt
      - name: Test real Home Assistant platform and flow APIs
        run: python -m pytest integration_tests -q
